name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (lint, type, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentdesk
          POSTGRES_PASSWORD: agentdesk
          POSTGRES_DB: agentdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentdesk"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # No real LLM calls in CI — providers are forced to the deterministic mock.
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      JWT_SECRET: ci-test-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://agentdesk:agentdesk@localhost:5432/agentdesk
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Type check (mypy)
        run: mypy app
      - name: Run migrations
        run: alembic upgrade head
      - name: Tests (pytest, mock providers)
        run: pytest -q

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
